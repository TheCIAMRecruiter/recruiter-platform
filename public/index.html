<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="description" content="Recruiter Intelligence Platform — Transmit Security" />

    <title>Recruiter Platform — Transmit Security</title>

    <!-- Favicon: Transmit "T" mark in navy + red -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B2A4A'/%3E%3Cpath d='M9 8 L9 24 M5 8 L13 8' stroke='%23E8192C' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231B2A4A'/%3E%3Cpath d='M50 44 L50 136 M28 44 L72 44' stroke='%23E8192C' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #F5F6F8;
        color: #1B2A4A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100%; }

      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #F5F6F8; }
      ::-webkit-scrollbar-thumb { background: #C5CAD8; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #1B2A4A; }

      /* Input / select base reset */
      input, select, textarea, button {
        font-family: inherit;
        font-size: inherit;
      }
      input:focus, select:focus, textarea:focus {
        outline: 2px solid #1B2A4A;
        outline-offset: 1px;
      }
      button:focus-visible {
        outline: 2px solid #E8192C;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
